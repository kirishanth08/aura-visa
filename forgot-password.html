<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Account Password - AuraVisa</title>
  <meta name="description" content="Secure password recovery for the AuraVisa client portal. Reset credentials through authenticated multi-factor verification.">
  
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('auravisa-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
      const savedDir = localStorage.getItem('auravisa-dir');
      if (savedDir) {
        document.documentElement.setAttribute('dir', savedDir);
      }
    })();
  </script>

    <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="alternate icon" type="image/png" href="assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top-Right Orientation & Theme Controls -->
  <div class="auth-top-controls">
    <button class="btn btn-sm btn-outline-aura rtl-toggle-btn" type="button" title="Toggle RTL / LTR orientation" aria-label="Toggle RTL">
      <span class="rtl-status-badge">RTL</span>
    </button>
    <button class="btn btn-sm btn-outline-aura theme-toggle-btn" type="button" title="Toggle Light / Dark theme" aria-label="Toggle theme">
      <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
    </button>
  </div>

  <!-- Standalone Password Recovery Workspace -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand-header">
        <a class="brand-logo mb-3" href="index.html">
          <span class="brand-badge"><i class="bi bi-globe-americas"></i></span>
          <span>Aura<span class="text-warning">Visa</span></span>
        </a>
        <h1 class="fs-4 fw-bold mb-1">Reset Password</h1>
        <p class="text-muted small mb-0">Enter your email to receive authenticated recovery instructions</p>
      </div>

      <form class="needs-validation-aura" action="login.html" method="get" novalidate>
        <div class="mb-4">
          <label class="form-label fw-semibold small" for="resetEmail">Registered Case Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" id="resetEmail" class="form-control border-start-0" placeholder="name@example.com" required>
          </div>
          <div class="form-text text-muted small mt-1">
            We'll send a 6-digit cryptographic verification code to your verified inbox.
          </div>
        </div>

        <button type="submit" class="btn btn-primary-aura w-100 py-2 fw-semibold">
          <i class="bi bi-send-fill me-2"></i>Send Password Reset Link
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="login.html" class="fw-semibold text-secondary small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>Return to Client Sign In
        </a>
      </div>

      <div class="text-center mt-4 pt-3 border-top small text-muted">
        <i class="bi bi-shield-check text-success me-1"></i> End-to-End Encrypted Verification
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
